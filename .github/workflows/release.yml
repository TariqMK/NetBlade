# Builds NetBlade for Windows, macOS and Linux, then creates a draft or public GitHub release.
# Run it manually from the Actions tab on main. It never commits or pushes to a branch; it only creates a tag and a release.
name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Draft or public release"
        type: choice
        options: [draft, public]
        default: draft
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

# Queue release runs one after another so two runs never pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: NetBlade
  PYTHON_VERSION: "3.13"
  # System libraries Qt (PySide6) needs on Linux to run and to be bundled by PyInstaller.
  LINUX_QT_PACKAGES: >-
    libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
    libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

jobs:
  version:
    name: Work out version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed so the API lists draft releases too
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            git tag --list
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name'
          } > existing_tags.txt
          tag="$(bash .github/scripts/next_version.sh "${{ inputs.bump }}" < existing_tags.txt)"
          echo "Next version: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  test:
    name: Run tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_QT_PACKAGES

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    name: Build ${{ matrix.target }}
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: macos-arm64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Check macOS runner is Apple Silicon
        if: runner.os == 'macOS'
        run: |
          arch="$(uname -m)"
          echo "Runner architecture: $arch"
          [ "$arch" = "arm64" ] || { echo "Expected arm64, got $arch"; exit 1; }

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_QT_PACKAGES

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Check Qt is available
        run: python -c "import PySide6.QtWidgets; print('PySide6', PySide6.__version__)"

      # Apply the release version on the runner only. Nothing is committed.
      - name: Apply version
        run: |
          printf '# Single source of the NetBlade version. The release workflow overwrites this on the build runner.\n__version__ = "%s"\n' "$VERSION" > netblade/_version.py
          cat netblade/_version.py

      # The .exe file icon. Linux executables have no file icon; the app sets its window icon at runtime.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "$APP_NAME" --icon assets/icon/netblade.ico --paths . netblade/__main__.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "$APP_NAME" --paths . netblade/__main__.py

      # macOS ships a single .app bundle; --onefile is not used for .app bundles.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --clean --windowed --name "$APP_NAME" --icon assets/icon/netblade.icns --osx-bundle-identifier com.tariqmk.netblade --paths . netblade/__main__.py

      # Starts the packaged app headless: proves Qt plugins and libraries were bundled and the version is right.
      - name: Check packaged app
        run: |
          case "$RUNNER_OS" in
            Windows) exe="dist/$APP_NAME.exe" ;;
            macOS)   exe="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" ;;
            Linux)   exe="dist/$APP_NAME" ;;
          esac
          [ -f "$exe" ] || { echo "Build produced no executable at $exe"; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            ls "dist/$APP_NAME.app/Contents/Resources/"*.icns || { echo "App bundle has no .icns icon"; exit 1; }
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windowed .exe has no console output, so check the exit code only.
            "$exe" --self-test
          else
            output="$("$exe" --self-test)"
            echo "Self-test output: $output"
            [ "$output" = "$APP_NAME $TAG" ] || { echo "Expected '$APP_NAME $TAG'"; exit 1; }
          fi

      - name: Package
        run: |
          mkdir -p release
          name="$APP_NAME-$TAG-${{ matrix.target }}"
          case "$RUNNER_OS" in
            Windows) cp "dist/$APP_NAME.exe" "release/$name.exe" ;;
            macOS)   ditto -c -k --keepParent "dist/$APP_NAME.app" "release/$name.zip" ;;
            Linux)   tar -czf "release/$name.tar.gz" -C dist "$APP_NAME" ;;
          esac
          ls -la release
          [ -n "$(ls -A release)" ] || { echo "No release files produced"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # Tag the exact commit that was built. Only a tag is pushed, never a branch.
      - name: Create tag
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft_flag=""
          [ "${{ inputs.release_type }}" = "draft" ] && draft_flag="--draft"
          gh release create "$TAG" release/* \
            --title "$APP_NAME $TAG" \
            --generate-notes \
            --verify-tag \
            $draft_flag
