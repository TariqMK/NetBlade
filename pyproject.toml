[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netblade"
description = "A desktop network toolkit."
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.8",
    "dnspython>=2.6",
    "icmplib>=3.0; sys_platform != 'win32'",
    "cryptography>=43",
    "truststore>=0.10",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[project.gui-scripts]
netblade = "netblade.app:run"

[tool.setuptools.packages.find]
include = ["netblade*"]

[tool.setuptools.dynamic]
version = { attr = "netblade._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
